{% load static %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Students</title>

    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>

<body>
    <h1>Students</h1>

    {% if students %}
        <ul>
            {% for s in students %}
                <li>{{ s.name }} — Age: {{ s.age }} — Email: {{ s.email }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No students found.</p>
    {% endif %}
</body>
</html>
