<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% load static %}
    <title>Student Directory</title>
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">Main application</p>
            <h1>Student Directory</h1>
            <p class="intro">A quick look at our enrolled students.</p>
        </header>

        {% if students %}
            <section class="student-grid" aria-label="Student records">
                {% for s in students %}
                    <article class="student-card">
                        <h2>{{ s.name }}</h2>
                        <p><span>Age</span>{{ s.age }}</p>
                        <p><span>Email</span><a href="mailto:{{ s.email }}">{{ s.email }}</a></p>
                    </article>
                {% endfor %}
            </section>
        {% else %}
            <p class="empty-state">No students found.</p>
        {% endif %}
    </main>
</body>
</html>
